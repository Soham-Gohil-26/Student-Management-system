<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySync | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="soft-card p-4" style="width:min(420px, 92vw);">
    <h1 class="h4 mb-1 brand">StudySync</h1>
    <p class="text-muted mb-4">Sign in to continue to your dashboard.</p>
    <form>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="you@college.edu" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="••••••••" />
      </div>
      <button type="button" class="btn btn-primary w-100" onclick="window.location.href='pages/dashboard/dashboard.html'">Login</button>
    </form>
  </div>
</body>
</html>
