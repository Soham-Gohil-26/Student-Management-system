<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Review | StudySync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <div class="d-flex app-shell">
    <aside class="sidebar p-3">
      <h2 class="h4 brand mb-4">StudySync</h2>
      <nav class="nav flex-column">
        <a data-nav class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
        <a data-nav class="nav-link" href="../attendance/attendance.html">Attendance</a>
        <a data-nav class="nav-link" href="../goals/goals.html">Goals</a>
        <a data-nav class="nav-link" href="../alerts/alerts.html">Alerts</a>
        <a data-nav class="nav-link" href="weekly-review.html">Weekly Review</a>
      </nav>
    </aside>
    <main class="main-panel">
      <div class="topbar mb-4"><h1 class="page-title">Weekly Reflection</h1></div>
      <div class="soft-card p-4">
        <div class="mb-3">
          <label class="range-label" for="toughestSubject">Toughest Subject This Week</label>
          <select id="toughestSubject" class="form-select">
            <option>DSA</option><option>DBMS</option><option>Operating Systems</option><option>Math</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="range-label">Productivity (1-5): <span id="productivityValue">3</span></label>
          <input class="form-range" type="range" min="1" max="5" value="3" id="productivity" />
        </div>
        <div class="mb-3">
          <label class="range-label">Stress (1-5): <span id="stressValue">2</span></label>
          <input class="form-range" type="range" min="1" max="5" value="2" id="stress" />
        </div>
        <div class="mb-4">
          <label class="range-label">Fatigue (1-5): <span id="fatigueValue">2</span></label>
          <input class="form-range" type="range" min="1" max="5" value="2" id="fatigue" />
        </div>
        <button class="btn btn-primary" id="reviewBtn">Submit Weekly Review</button>
        <p class="mt-3 mb-0 text-muted" id="reviewResult"></p>
      </div>
    </main>
  </div>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/weekly-review.js"></script>
</body>
</html>
