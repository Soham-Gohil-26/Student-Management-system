<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | StudySync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <div class="d-flex app-shell">
    <aside class="sidebar p-3">
      <h2 class="h4 brand mb-4">StudySync</h2>
      <nav class="nav flex-column">
        <a data-nav class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
        <a data-nav class="nav-link" href="attendance.html">Attendance</a>
        <a data-nav class="nav-link" href="../goals/goals.html">Goals</a>

        <a data-nav class="nav-link" href="../weekly-review/weekly-review.html">Weekly Review</a>
      </nav>
    </aside>
    <main class="main-panel">
      <div class="topbar mb-4"><h1 class="page-title">Attendance Tracker</h1></div>
      <div class="soft-card p-3 mb-3">
        <h2 class="section-title mb-3">Subject-wise Attendance</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Subject</th><th>Attended</th><th>Total</th><th>Percentage</th><th>Status</th></tr></thead>
            <tbody id="attendanceRows"></tbody>
          </table>
        </div>
      </div>
      <div class="soft-card p-3">
        <h2 class="section-title">Risk Prediction</h2>
        <p class="text-muted mb-0" id="attendancePrediction"></p>
      </div>
    </main>
  </div>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/attendance.js"></script>
